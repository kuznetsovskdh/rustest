services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutest"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  auth-service:
    build: ./services/auth-service
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  test-service:
    build: ./services/test-service
    env_file: .env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  result-service:
    build: ./services/result-service
    env_file: .env
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy

  reference-service:
    build: ./services/reference-service
    env_file: .env
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - test-service
      - result-service
      - reference-service

volumes:
  postgres_data:
