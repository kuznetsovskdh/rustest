services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutest"]
      interval: 5s
      retries: 5
    networks:
      - eh_network
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - eh_network
  auth-service:
    build: ./services/auth-service
    env_file: .env
    ports:
      - "8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eh_network
  test-service:
    build: ./services/test-service
    env_file: .env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eh_network
  result-service:
    build: ./services/result-service
    env_file: .env
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EH_BASE_URL: http://experimenthub-app-1:8000
      EH_EXPERIMENT_ID: "2"
    networks:
      - eh_network
  reference-service:
    build: ./services/reference-service
    env_file: .env
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eh_network
  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - auth-service
      - test-service
      - result-service
      - reference-service
    networks:
      - eh_network

networks:
  eh_network:
    external: true

volumes:
  postgres_data:
